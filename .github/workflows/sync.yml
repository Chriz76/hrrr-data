name: Run Pipeline & Upload to Bunny Storage

# Layout in der Zone:
#   runs/<run>/tiles/<ts>/<z>/<x>/<y>.bin   (vor-komprimiert, gzip)
#   index.json                              (Root: Timestamps, Format, Bounds,
#                                            Coverage, tiles_url)
#
# Ablauf: Run komplett nach runs/<run>/ hochladen, dann index.json im Root
# umstellen (atomarer Switch), erst danach alte Runs loeschen.
#
# Einmalige Pull-Zone-Konfiguration (Edge Rules fuer Content-Encoding/Cache,
# CORS) siehe README.md.

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Der vom Worker erkannte Lauf'
        required: true
        type: string

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Fest aus dem Access-Tab der Zone (Frankfurt, DE).
  BUNNY_ENDPOINT: https://storage.bunnycdn.com
  BUNNY_STORAGE_ZONE: gdsfgfsdgsfd
  # Die Pipeline schreibt direkt in den Deploy-Ordner.
  OUTPUT_DIR: ./t
  # Parallelitaet (48 PUTs / 24 DELETEs) und das Rollback-Fenster (KEEP_RUNS=1)
  # stehen als Defaults in pipeline/src/upload_bunny.py.

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run pipeline
        id: pipeline
        env:
          TARGET_RUN: ${{ github.event.inputs.run }}
        run: python pipeline/src/pipeline.py

      - name: Output pruefen
        run: |
          set -euo pipefail
          if [ ! -f "$OUTPUT_DIR/index.json" ]; then
            echo "::error::$OUTPUT_DIR/index.json fehlt - die Pipeline hat nichts erzeugt"
            exit 1
          fi
          echo "Tile-Sets: $(find "$OUTPUT_DIR/tiles" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "Dateien:   $(find "$OUTPUT_DIR" -type f | wc -l)"
          echo "Volumen:   $(du -sh "$OUTPUT_DIR" | cut -f1)"

      # Jeder Run landet unter runs/<run>/. Erst wenn der komplette Run oben
      # ist, wird index.json im Root umgestellt (atomarer Switch); danach
      # werden aeltere Runs geloescht (KEEP_RUNS bleiben als Rollback).
      - name: Upload nach Bunny Storage
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          RUN_ID: ${{ steps.pipeline.outputs.run_id }}
        run: |
          set -euo pipefail
          : "${RUN_ID:?Run-ID fehlt - die Pipeline hat keine run_id ausgegeben}"
          python pipeline/src/upload_bunny.py \
            --dir "$OUTPUT_DIR" \
            --run "$RUN_ID" \
            --prune

      # Kein Cache-Purge mehr: die Edge Rule "Override Cache Time = 0" sorgt
      # dafuer, dass index.json bei jedem Abruf vom Origin kommt. Die Kacheln
      # liegen unter neuen Run-Pfaden und sind damit ohnehin Cache-Miss.
